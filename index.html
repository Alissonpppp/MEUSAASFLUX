@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}.wrap,.userwrap{width:calc(100% - 20px)}.auth .card{padding:20px}.toolbar{width:100%}.toolbar input,.toolbar select{width:100%;min-width:0}.top{padding:12px 14px}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInAnonymously, signInWithEmailAndPassword, signOut,
  setPersistence, browserLocalPersistence, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  writeBatch, runTransaction, query, where, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5I6RG-FicgOThwhl-1LLWySo3JRjK1YI",
  authDomain: "bompre-8a7c0.firebaseapp.com",
  databaseURL: "https://bompre-8a7c0-default-rtdb.firebaseio.com",
  projectId: "bompre-8a7c0",
  storageBucket: "bompre-8a7c0.firebasestorage.app",
  messagingSenderId: "390830730249",
  appId: "1:390830730249:web:106a313c6d2bae02ec5cd8"
};

/*
  IMPORTANTE:
  - Este HTML usa CLOUD FIRESTORE, não Realtime Database.
  - O frontend é público por natureza.
  - A segurança de verdade está nas FIRESTORE SECURITY RULES abaixo.
  - Cole essas regras no Firebase Console > Firestore Database > Rules.
*/
const FIRESTORE_RULES = `rules_version = '2';

service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() {
      return request.auth != null;
    }

    function isAdmin() {
      return signedIn()
        && exists(/databases/$(database)/documents/admins/$(request.auth.uid))
        && get(/databases/$(database)/documents/admins/$(request.auth.uid)).data.active == true;
    }

    function userPath() {
      return /databases/$(database)/documents/users/$(request.auth.uid);
    }

    function activeKeyHash() {
      return get(userPath()).data.activeKeyHash;
    }

    function keyPath(keyHash) {
      return /databases/$(database)/documents/keys/$(keyHash);
    }

    function claimPath(keyHash) {
      return /databases/$(database)/documents/claims/$(keyHash);
    }

    function hasActiveKey() {
      return signedIn()
        && exists(userPath())
        && get(userPath()).data.activeKeyHash is string
        && exists(keyPath(activeKeyHash()))
        && exists(claimPath(activeKeyHash()))
        && get(claimPath(activeKeyHash())).data.uid == request.auth.uid
        && get(claimPath(activeKeyHash())).data.keyHash == activeKeyHash()
        && get(keyPath(activeKeyHash())).data.revoked == false
        && get(claimPath(activeKeyHash())).data.activatedAt is timestamp
        && get(claimPath(activeKeyHash())).data.durationDays in [7, 15, 30]
        && request.time < get(claimPath(activeKeyHash())).data.activatedAt
            + duration.value(get(claimPath(activeKeyHash())).data.durationDays, 'd');
    }

    match /admins/{uid} {
      allow get: if signedIn() && request.auth.uid == uid;
      allow list: if false;
      allow create, update, delete: if false;
    }

    // Clientes podem ler UMA key pelo hash conhecido, mas não listar keys.
    // Somente o admin altera/cria/exclui documentos de keys.
    match /keys/{keyHash} {
      allow get: if isAdmin() || signedIn();
      allow list: if isAdmin();
      allow create, update, delete: if isAdmin();
    }

    // O primeiro navegador cria o claim. Como o ID = hash da key,
    // só pode existir um claim por key.
    match /claims/{keyHash} {
      allow get: if isAdmin()
        || (
          signedIn()
          && resource.data.uid == request.auth.uid
        );

      allow list: if isAdmin();

      allow create: if signedIn()
        && request.resource.data.keys()
            .hasOnly(['keyHash','keyCode','uid','activatedAt','durationDays'])
        && request.resource.data.keyHash == keyHash
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.activatedAt == request.time
        && exists(keyPath(keyHash))
        && get(keyPath(keyHash)).data.revoked == false
        && get(keyPath(keyHash)).data.durationDays in [7, 15, 30]
        && request.resource.data.durationDays == get(keyPath(keyHash)).data.durationDays
        && request.resource.data.keyCode == get(keyPath(keyHash)).data.code;

      allow update: if false;
      allow delete: if isAdmin();
    }

    match /users/{uid} {
      allow get: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow list: if isAdmin();

      // activeKeyHash sozinho não libera nada.
      // hasActiveKey() também exige um claim pertencente ao mesmo UID.
      allow create, update: if isAdmin()
        || (
          signedIn()
          && request.auth.uid == uid
          && request.resource.data.keys().hasOnly(['activeKeyHash','updatedAt'])
          && request.resource.data.activeKeyHash is string
          && request.resource.data.updatedAt == request.time
        );

      allow delete: if isAdmin();

      match /deliveries/{stockId} {
        allow get, list: if isAdmin() || (signedIn() && request.auth.uid == uid);

        allow create: if signedIn()
          && request.auth.uid == uid
          && hasActiveKey()
          && request.resource.data.keys().hasOnly(['stockId','keyHash','deliveredAt'])
          && request.resource.data.stockId == stockId
          && request.resource.data.keyHash == activeKeyHash()
          && request.resource.data.deliveredAt == request.time
          && getAfter(/databases/$(database)/documents/stockMeta/$(stockId)).data.status == 'delivered'
          && getAfter(/databases/$(database)/documents/stockMeta/$(stockId)).data.deliveredToUid == uid
          && getAfter(/databases/$(database)/documents/stockMeta/$(stockId)).data.deliveredToKeyHash
              == activeKeyHash();

        allow update: if false;
        allow delete: if isAdmin();
      }
    }

    match /stockMeta/{stockId} {
      allow get, list: if isAdmin()
        || (
          hasActiveKey()
          && (
            resource.data.status == 'available'
            || (
              resource.data.status == 'delivered'
              && resource.data.deliveredToUid == request.auth.uid
              && resource.data.deliveredToKeyHash == activeKeyHash()
            )
          )
        );

      allow create, delete: if isAdmin();

      allow update: if isAdmin()
        || (
          hasActiveKey()
          && resource.data.status == 'available'
          && request.resource.data.status == 'delivered'
          && request.resource.data.deliveredToUid == request.auth.uid
          && request.resource.data.deliveredToKeyHash == activeKeyHash()
          && request.resource.data.deliveredToKeyCode
              == get(keyPath(activeKeyHash())).data.code
          && request.resource.data.deliveredAt == request.time
          && request.resource.data.diff(resource.data).affectedKeys()
              .hasOnly([
                'status','deliveredToUid','deliveredToKeyHash',
                'deliveredToKeyCode','deliveredAt'
              ])
          && getAfter(
              /databases/$(database)/documents/users/$(request.auth.uid)/deliveries/$(stockId)
            ).data.stockId == stockId
          && getAfter(
              /databases/$(database)/documents/users/$(request.auth.uid)/deliveries/$(stockId)
            ).data.keyHash == activeKeyHash()
        );
    }

    match /stockContent/{stockId} {
      allow get: if isAdmin()
        || (
          hasActiveKey()
          && exists(
            /databases/$(database)/documents/users/$(request.auth.uid)/deliveries/$(stockId)
          )
          && get(
            /databases/$(database)/documents/users/$(request.auth.uid)/deliveries/$(stockId)
          ).data.keyHash == activeKeyHash()
          && get(/databases/$(database)/documents/stockMeta/$(stockId)).data.deliveredToUid
              == request.auth.uid
          && get(/databases/$(database)/documents/stockMeta/$(stockId)).data.deliveredToKeyHash
              == activeKeyHash()
        );

      allow list: if isAdmin();
      allow create, update, delete: if isAdmin();
    }

    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;

const RULES_REVISION="CLAIM-V1-NO-KEY-UPDATE";
const adminApp = initializeApp(firebaseConfig, "adminApp");
const clientApp = initializeApp(firebaseConfig, "clientApp");
const adminAuth = getAuth(adminApp);
const clientAuth = getAuth(clientApp);
const adminDb = getFirestore(adminApp);
const clientDb = getFirestore(clientApp);

await setPersistence(adminAuth, browserLocalPersistence).catch(()=>{});
await setPersistence(clientAuth, browserLocalPersistence).catch(()=>{});

const appEl=document.getElementById("app"),modalEl=document.getElementById("modal"),toastEl=document.getElementById("toast");
const CLIENT_KEY_SESSION="keystock_active_code_v4";

let adminTab="dashboard",stockFilter="all",stockSearch="",keyFilter="all",keySearch="",logSearch="";
let timer=null,toastTimer=null;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function fmt(v){if(!v)return"—";const d=v?.toDate?v.toDate():new Date(v);return new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(d)}
function ms(v){if(!v)return 0;return v?.toMillis?v.toMillis():Number(v)}
function remaining(x){if(x<=0)return"Expirada";const s=Math.floor(x/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m ${ss}s`:`${m}m ${ss}s`}
function randomChars(n=15){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>chars[x%chars.length]).join("")}
function makeKey(){return`KEY-${randomChars(5)}-${randomChars(5)}-${randomChars(5)}`}
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function load(t="Carregando..."){clearInterval(timer);appEl.innerHTML=`<div class="loader"><div><div class="spin"></div>${esc(t)}</div></div>`}
function toast(t,bad=false){clearTimeout(toastTimer);toastEl.className=`toast ${bad?"err":""} show`;toastEl.textContent=t;toastTimer=setTimeout(()=>toastEl.className="toast",2700)}
function top(title,right=""){return`<div class="top"><div class="brand"><div class="logo">K</div><div>${esc(title)}</div></div><div class="actions">${right}</div></div>`}
function keyStatus(k){if(k.revoked)return"revoked";if(!k.activatedAt)return"unused";return Date.now()>=ms(k.activatedAt)+Number(k.durationDays)*86400000?"expired":"active"}
function keyLabel(s){return({unused:"Não usada",active:"Ativa",expired:"Expirada",revoked:"Revogada"})[s]||s}
function errorText(e){
  console.error(e);
  const c=e?.code||"";
  if(String(e?.message||"").startsWith("ETAPA "))return e.message;
  if(c.includes("permission-denied"))return"O Firestore bloqueou esta ação. Digite ksrules na página vazia, copie as Rules CLAIM V1 e publique em Firestore Database → Rules.";
  if(c.includes("unauthorized-domain"))return"Adicione o domínio do seu GitHub Pages em Authentication > Settings > Authorized domains.";
  if(c.includes("operation-not-allowed"))return"O login Anonymous está desativado. No Firebase: Authentication → Sign-in method → Anonymous → Enable.";
  if(c.includes("admin-restricted-operation"))return"O Firebase bloqueou o login anônimo. Ative Anonymous em Authentication → Sign-in method.";
  if(c.includes("invalid-credential"))return"Email ou senha do administrador incorretos.";
  if(c.includes("failed-precondition")&&String(e.message).includes("index"))return"O Firestore pediu um índice. Abra o link mostrado no Console do navegador e crie o índice.";
  return e?.message?.replace(/^FirebaseError:\s*/,"")||"Ocorreu um erro.";
}
function confirmBox(title,text,fn){
  modalEl.innerHTML=`<div class="modalbg" id="mb"><div class="modal"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="modalact"><button class="btn" id="cancel">Cancelar</button><button class="btn danger" id="ok">Confirmar</button></div></div></div>`;
  const close=()=>modalEl.innerHTML="";
  document.getElementById("cancel").onclick=close;document.getElementById("mb").onclick=e=>e.target.id==="mb"&&close();
  document.getElementById("ok").onclick=()=>{close();fn()};
}
async function copyText(text,msg=true){
  try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  if(msg)toast("Copiado.");
}

async function ensureAnon(){
  if(clientAuth.currentUser)return clientAuth.currentUser;
  const cred=await signInAnonymously(clientAuth);
  return cred.user;
}

async function isAdmin(){
  const u=adminAuth.currentUser;if(!u)return false;
  const s=await getDoc(doc(adminDb,"admins",u.uid));
  return s.exists()&&s.data().active===true;
}

async function home(){
  clearInterval(timer);
  const code=sessionStorage.getItem(CLIENT_KEY_SESSION);
  if(code){try{return await renderUser(code)}catch(e){sessionStorage.removeItem(CLIENT_KEY_SESSION);toast(errorText(e),true)}}
  renderLogin();
}

function renderLogin(){
  appEl.innerHTML=`<div class="auth"><div class="card">
    <div class="brand"><div class="logo">K</div><div>KeyStock</div></div>
    <h1 class="hero">Acesso</h1>
    <p class="sub">Digite ou cole sua key para acessar suas entregas e solicitar novas contas.</p>

    <div id="keyBox">
      <div class="field">
        <label for="keyInput">Key de acesso</label>
        <div class="key-input-wrap">
          <input id="keyInput"
                 class="mono"
                 type="text"
                 inputmode="text"
                 autocomplete="off"
                 autocapitalize="characters"
                 spellcheck="false"
                 aria-label="Key de acesso"
                 placeholder="KEY-XXXXX-XXXXX-XXXXX">
          <button class="btn sm" type="button" id="pasteKey">Colar key</button>
        </div>
      </div>

      <button class="btn primary block" type="button" id="keyGo">Entrar</button>
      <div id="keyError" class="key-error hidden"></div>

      <div class="notice" style="margin-top:14px">
        Na primeira utilização a key começa a contar e fica vinculada a este navegador.
      </div>
    </div>
  </div></div>`;

  const keyInput=document.getElementById("keyInput");
  const keyError=document.getElementById("keyError");
  const pasteButton=document.getElementById("pasteKey");

  const showKeyError=msg=>{
    keyError.textContent=msg;
    keyError.classList.remove("hidden");
    keyInput.focus();
  };

  const clearKeyError=()=>keyError.classList.add("hidden");

  const normalizeKey=()=>{
    let value=keyInput.value.toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9-]/g,"");

    // Se o cliente colar somente os 15 caracteres, monta KEY-XXXXX-XXXXX-XXXXX.
    const compact=value.replace(/^KEY-?/,"").replaceAll("-","");
    if(compact.length===15 && /^[A-Z2-9]{15}$/.test(compact)){
      value=`KEY-${compact.slice(0,5)}-${compact.slice(5,10)}-${compact.slice(10,15)}`;
    }

    keyInput.value=value.slice(0,23);
  };

  // Nenhum detector/atalho global interfere no campo de key.
  ["keydown","keyup","keypress","input","beforeinput","paste","click","focus"].forEach(evt=>{
    keyInput.addEventListener(evt,e=>e.stopPropagation());
  });

  keyInput.addEventListener("input",()=>{
    normalizeKey();
    clearKeyError();
  });

  keyInput.addEventListener("paste",()=>{
    setTimeout(()=>{
      normalizeKey();
      clearKeyError();
      keyInput.focus();
    },0);
  });

  pasteButton.onclick=async()=>{
    try{
      const text=await navigator.clipboard.readText();
      if(!text)return showKeyError("Sua área de transferência está vazia.");
      keyInput.value=text;
      normalizeKey();
      clearKeyError();
      keyInput.focus();
      const len=keyInput.value.length;
      try{keyInput.setSelectionRange(len,len)}catch{}
    }catch{
      showKeyError("O navegador não liberou a leitura automática. Cole a key com Ctrl + V.");
    }
  };

  const keyLogin=async()=>{
    clearKeyError();
    normalizeKey();
    const code=keyInput.value.trim().toUpperCase();

    if(!/^KEY-[A-Z2-9]{5}-[A-Z2-9]{5}-[A-Z2-9]{5}$/.test(code)){
      return showKeyError("Formato inválido. Use uma key no formato KEY-XXXXX-XXXXX-XXXXX.");
    }

    const oldText=document.getElementById("keyGo").textContent;
    document.getElementById("keyGo").disabled=true;
    document.getElementById("keyGo").textContent="Validando...";

    try{
      await loginKey(code);
      sessionStorage.setItem(CLIENT_KEY_SESSION,code);
      renderUser(code);
    }catch(e){
      sessionStorage.removeItem(CLIENT_KEY_SESSION);
      document.getElementById("keyGo").disabled=false;
      document.getElementById("keyGo").textContent=oldText;
      showKeyError(errorText(e));
    }
  };

  document.getElementById("keyGo").onclick=keyLogin;

  keyInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      keyLogin();
    }
  });

  setTimeout(()=>keyInput.focus(),80);
}

async function loginKey(code){
  const user=await ensureAnon();
  const uid=user.uid;
  const hash=await sha256(code);

  const keyRef=doc(clientDb,"keys",hash);
  const claimRef=doc(clientDb,"claims",hash);
  const userRef=doc(clientDb,"users",uid);

  // 1) A key é somente leitura para clientes.
  let keySnap;
  try{
    keySnap=await getDoc(keyRef);
  }catch(e){
    throw new Error("ETAPA KEY_READ: o Firestore bloqueou a leitura da key. Publique as Rules CLAIM V1.");
  }

  if(!keySnap.exists())throw new Error("Key inválida. Ela não existe.");
  const k=keySnap.data();

  if(k.revoked)throw new Error("Esta key foi revogada.");
  if(![7,15,30].includes(Number(k.durationDays)))throw new Error("Esta key possui um prazo inválido.");

  // 2) Procura o claim. Se for de outro UID, as Rules negam a leitura:
  // isso significa que a key já pertence a outro navegador.
  let claimSnap=null;
  try{
    claimSnap=await getDoc(claimRef);
  }catch(e){
    if(String(e?.code||"").includes("permission-denied")){
      throw new Error("Esta key já foi vinculada a outro navegador.");
    }
    throw e;
  }

  // 3) Primeiro acesso: cria um claim único. A KEY NÃO É ALTERADA.
  if(!claimSnap.exists()){
    try{
      await setDoc(claimRef,{
        keyHash:hash,
        keyCode:code,
        uid,
        activatedAt:serverTimestamp(),
        durationDays:Number(k.durationDays)
      });
    }catch(e){
      // Se duas pessoas tentarem ao mesmo tempo, apenas uma consegue criar.
      try{
        const check=await getDoc(claimRef);
        if(check.exists()&&check.data().uid===uid){
          claimSnap=check;
        }else{
          throw new Error("Esta key já foi vinculada a outro navegador.");
        }
      }catch(e2){
        if(String(e2?.message||"").includes("outro navegador"))throw e2;
        throw new Error("ETAPA CLAIM_CREATE: o Firestore bloqueou a criação do vínculo. Publique as Rules CLAIM V1.");
      }
    }
  }else{
    if(claimSnap.data().uid!==uid)throw new Error("Esta key já foi vinculada a outro navegador.");
  }

  // 4) Lê novamente o claim para obter o timestamp real do servidor.
  let finalClaim;
  try{
    const cs=await getDoc(claimRef);
    if(!cs.exists())throw new Error("Vínculo não encontrado.");
    finalClaim=cs.data();
  }catch(e){
    throw new Error("ETAPA CLAIM_READ: o vínculo foi criado, mas não pôde ser lido.");
  }

  const activatedMs=ms(finalClaim.activatedAt);
  const expiresAt=activatedMs+Number(finalClaim.durationDays)*86400000;
  if(!activatedMs)throw new Error("A ativação ainda não foi confirmada pelo Firebase. Atualize e tente novamente.");
  if(Date.now()>=expiresAt)throw new Error("Esta key expirou.");

  // 5) Salva apenas a key ativa do usuário.
  try{
    await setDoc(userRef,{
      activeKeyHash:hash,
      updatedAt:serverTimestamp()
    },{merge:true});
  }catch(e){
    throw new Error("ETAPA USER_SESSION: o Firestore bloqueou a sessão do usuário. Publique as Rules CLAIM V1.");
  }

  return{uid,hash,claim:finalClaim,expiresAt};
}
async function clientState(code){
  const user=await ensureAnon();
  const uid=user.uid;
  const hash=await sha256(code);

  const keyRef=doc(clientDb,"keys",hash);
  const claimRef=doc(clientDb,"claims",hash);
  const userRef=doc(clientDb,"users",uid);

  let keySnap,claimSnap,userSnap;
  try{
    [keySnap,claimSnap,userSnap]=await Promise.all([
      getDoc(keyRef),
      getDoc(claimRef),
      getDoc(userRef)
    ]);
  }catch(e){
    if(String(e?.code||"").includes("permission-denied")){
      throw new Error("Esta key está vinculada a outro navegador ou as Rules CLAIM V1 ainda não foram publicadas.");
    }
    throw e;
  }

  if(!keySnap.exists())throw new Error("Key inválida.");
  if(!claimSnap.exists())throw new Error("Esta key ainda não foi ativada.");

  const k=keySnap.data();
  const claim=claimSnap.data();

  if(claim.uid!==uid)throw new Error("Esta key está vinculada a outro navegador.");
  if(k.revoked)throw new Error("Esta key foi revogada.");

  const exp=ms(claim.activatedAt)+Number(claim.durationDays)*86400000;
  if(Date.now()>=exp)throw new Error("Esta key expirou.");

  if(!userSnap.exists()||userSnap.data().activeKeyHash!==hash){
    await setDoc(userRef,{
      activeKeyHash:hash,
      updatedAt:serverTimestamp()
    },{merge:true});
  }

  const delSnap=await getDocs(collection(clientDb,"users",uid,"deliveries"));
  const metas=delSnap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(x=>x.keyHash===hash)
    .sort((a,b)=>ms(b.deliveredAt)-ms(a.deliveredAt));

  const deliveries=[];
  for(const x of metas){
    try{
      const cs=await getDoc(doc(clientDb,"stockContent",x.stockId));
      if(cs.exists()){
        deliveries.push({
          stockId:x.stockId,
          text:cs.data().text||"",
          deliveredAt:x.deliveredAt
        });
      }
    }catch{}
  }

  let av;
  try{
    av=await getDocs(
      query(collection(clientDb,"stockMeta"),where("status","==","available"),limit(1))
    );
  }catch(e){
    throw new Error("ETAPA STOCK_QUERY: a key entrou, mas o Firestore bloqueou a consulta do estoque. Publique as Rules CLAIM V1.");
  }

  return{
    uid,
    hash,
    key:k,
    claim,
    expiresAt:exp,
    deliveries,
    hasStock:!av.empty
  };
}

async function claimStock(code,keyHash){
  load("Reservando item...");
  const user=await ensureAnon(),uid=user.uid;

  for(let attempt=0;attempt<5;attempt++){
    try{
      const qSnap=await getDocs(query(collection(clientDb,"stockMeta"),where("status","==","available"),limit(10)));
      if(qSnap.empty){toast("Sem estoque disponível no momento.",true);return renderUser(code)}

      let claimed=false;
      for(const candidate of qSnap.docs){
        try{
          await runTransaction(clientDb,async tx=>{
            const metaRef=doc(clientDb,"stockMeta",candidate.id);
            const deliveryRef=doc(clientDb,"users",uid,"deliveries",candidate.id);
            const mSnap=await tx.get(metaRef);
            if(!mSnap.exists()||mSnap.data().status!=="available")throw new Error("ITEM_JA_USADO");
            tx.update(metaRef,{
              status:"delivered",deliveredToUid:uid,deliveredToKeyHash:keyHash,
              deliveredToKeyCode:code,deliveredAt:serverTimestamp()
            });
            tx.set(deliveryRef,{stockId:candidate.id,keyHash,deliveredAt:serverTimestamp()});
          });
          claimed=true;break;
        }catch(e){
          if(String(e?.message||"").includes("ITEM_JA_USADO"))continue;
          if(String(e?.code||"").includes("aborted"))continue;
          throw e;
        }
      }
      if(claimed){toast("Conta entregue com sucesso.");return renderUser(code)}
    }catch(e){
      if(attempt===4){toast(errorText(e),true);return renderUser(code)}
    }
  }
  toast("Não consegui reservar um item agora. Tente novamente.",true);renderUser(code);
}

async function adminSnapshot(){
  if(!await isAdmin())throw new Error("Usuário sem permissão administrativa.");

  const [keysSnap,claimsSnap,stockSnap]=await Promise.all([
    getDocs(collection(adminDb,"keys")),
    getDocs(collection(adminDb,"claims")),
    getDocs(collection(adminDb,"stockMeta"))
  ]);

  const claimsByHash=new Map(
    claimsSnap.docs.map(d=>[d.id,{id:d.id,...d.data()}])
  );

  const keys=keysSnap.docs.map(d=>{
    const base={hash:d.id,...d.data()};
    const claim=claimsByHash.get(d.id);
    return{
      ...base,
      activatedAt:claim?.activatedAt||null,
      boundUid:claim?.uid||null,
      lastAccessAt:claim?.activatedAt||null,
      accessCount:claim?1:0
    };
  });

  const stock=[];
  for(const m of stockSnap.docs){
    let text="";
    try{
      const c=await getDoc(doc(adminDb,"stockContent",m.id));
      if(c.exists())text=c.data().text||"";
    }catch{}
    stock.push({id:m.id,...m.data(),text});
  }

  keys.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  stock.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  return{keys,stock};
}

  <div class="section"><div><h2>Estoque</h2><p>${f.length} item(ns).</p></div><div class="toolbar"><input id="stockSearch" placeholder="Buscar..." value="${esc(stockSearch)}"><select id="stockFilter"><option value="all">Todos</option><option value="available" ${stockFilter==="available"?"selected":""}>Disponíveis</option><option value="delivered" ${stockFilter==="delivered"?"selected":""}>Entregues</option></select></div></div>
  <div class="tablewrap"><table><thead><tr><th>Status</th><th>Mensagem</th><th>Entregue para</th><th>Criado</th><th>Entregue</th><th>Ações</th></tr></thead><tbody>
  ${f.map(x=>`<tr><td><span class="badge ${x.status}">${x.status==="available"?"Disponível":"Entregue"}</span></td><td><div style="max-width:360px;white-space:pre-wrap;word-break:break-word">${esc(x.text)}</div></td><td class="mono small">${esc(x.deliveredToKeyCode||"—")}</td><td>${fmt(x.createdAt)}</td><td>${fmt(x.deliveredAt)}</td><td><div class="actions"><button class="btn sm" data-scopy="${x.id}">Copiar</button><button class="btn sm ${x.status==="available"?"warning":"success"}" data-stoggle="${x.id}">${x.status==="available"?"Marcar entregue":"Marcar disponível"}</button><button class="btn sm danger" data-sdelete="${x.id}">Excluir</button></div></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">Nenhum item.</div></td></tr>`}
  </tbody></table></div>`;

  document.getElementById("addStock").onclick=async()=>{
    const raw=document.getElementById("stockText").value.trim();if(!raw)return toast("Digite o estoque.",true);
    const blocks=raw.split(/\n\s*---\s*\n/g).map(x=>x.trim()).filter(Boolean);
    if(blocks.length>100)return toast("Adicione no máximo 100 itens por vez.",true);
    try{
      const batch=writeBatch(adminDb);
      for(const text of blocks){
        const metaRef=doc(collection(adminDb,"stockMeta")),id=metaRef.id;
        batch.set(metaRef,{status:"available",createdAt:serverTimestamp(),deliveredToUid:null,deliveredToKeyHash:null,deliveredToKeyCode:null,deliveredAt:null});
        batch.set(doc(adminDb,"stockContent",id),{text});
      }
      await batch.commit();toast(`${blocks.length} item(ns) adicionado(s).`);renderAdmin();
    }catch(e){toast(errorText(e),true)}
  };
  document.getElementById("stockSearch").onchange=e=>{stockSearch=e.target.value;renderAdmin()};document.getElementById("stockFilter").onchange=e=>{stockFilter=e.target.value;renderAdmin()};
  document.querySelectorAll("[data-scopy]").forEach(b=>b.onclick=()=>{const x=s.stock.find(v=>v.id===b.dataset.scopy);x&&copyText(x.text)});
  document.querySelectorAll("[data-stoggle]").forEach(b=>b.onclick=async()=>{
    const x=s.stock.find(v=>v.id===b.dataset.stoggle);if(!x)return;
    try{
      if(x.status==="available")await updateDoc(doc(adminDb,"stockMeta",x.id),{status:"delivered",deliveredToUid:null,deliveredToKeyHash:null,deliveredToKeyCode:"ADMIN-MANUAL",deliveredAt:serverTimestamp()});
      else await updateDoc(doc(adminDb,"stockMeta",x.id),{status:"available",deliveredToUid:null,deliveredToKeyHash:null,deliveredToKeyCode:null,deliveredAt:null});
      renderAdmin();
    }catch(e){toast(errorText(e),true)}
  });
  document.querySelectorAll("[data-sdelete]").forEach(b=>b.onclick=()=>confirmBox("Excluir item","O item e seu conteúdo serão removidos.",async()=>{
    const x=s.stock.find(v=>v.id===b.dataset.sdelete);if(!x)return;
    try{
      const batch=writeBatch(adminDb);batch.delete(doc(adminDb,"stockMeta",x.id));batch.delete(doc(adminDb,"stockContent",x.id));
      if(x.deliveredToUid)batch.delete(doc(adminDb,"users",x.deliveredToUid,"deliveries",x.id));
      await batch.commit();toast("Item excluído.");renderAdmin();
    }catch(e){toast(errorText(e),true)}
  }));
}

function adminKeys(c,s){
  const f=s.keys.filter(k=>{const st=keyStatus(k),q=keySearch.trim().toLowerCase();return(keyFilter==="all"||st===keyFilter)&&(!q||(k.code||"").toLowerCase().includes(q)||(k.note||"").toLowerCase().includes(q))});
  c.innerHTML=`<div class="card"><div class="section" style="margin:0 0 14px"><div><h2>Criar keys</h2><p>7, 15 ou 30 dias. O prazo só começa no primeiro acesso.</p></div></div>
    <div class="grid g3"><div class="field"><label>Duração</label><select id="duration"><option value="7">7 dias</option><option value="15">15 dias</option><option value="30">30 dias</option></select></div><div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" max="100" value="1"></div><div class="field"><label>Observação</label><input id="note" placeholder="Ex.: Cliente João"></div></div>
    <div class="actions"><button class="btn primary" id="createKeys">Gerar key(s)</button><button class="btn" id="copyUnused">Copiar não usadas</button></div>
  </div>
  <div class="section"><div><h2>Keys</h2><p>${f.length} key(s).</p></div><div class="toolbar"><input id="keySearch" placeholder="Buscar..." value="${esc(keySearch)}"><select id="keyFilter"><option value="all">Todas</option><option value="unused" ${keyFilter==="unused"?"selected":""}>Não usadas</option><option value="active" ${keyFilter==="active"?"selected":""}>Ativas</option><option value="expired" ${keyFilter==="expired"?"selected":""}>Expiradas</option><option value="revoked" ${keyFilter==="revoked"?"selected":""}>Revogadas</option></select></div></div>
  <div class="tablewrap"><table><thead><tr><th>Status</th><th>Key</th><th>Prazo</th><th>Ativada</th><th>Último acesso</th><th>Acessos</th><th>Obs.</th><th>Ações</th></tr></thead><tbody>
  ${f.map(k=>{const st=keyStatus(k);return`<tr><td><span class="badge ${st}">${keyLabel(st)}</span></td><td class="mono"><b>${esc(k.code||"")}</b></td><td>${k.durationDays} dias</td><td>${fmt(k.activatedAt)}</td><td>${fmt(k.lastAccessAt)}</td><td>${k.accessCount||0}</td><td>${esc(k.note||"—")}</td><td><div class="actions"><button class="btn sm" data-kcopy="${k.hash}">Copiar</button>${st!=="expired"?`<button class="btn sm ${k.revoked?"success":"warning"}" data-krevoke="${k.hash}">${k.revoked?"Reativar":"Revogar"}</button>`:""}<button class="btn sm danger" data-kdelete="${k.hash}">Excluir</button></div></td></tr>`}).join("")||`<tr><td colspan="8"><div class="empty">Nenhuma key.</div></td></tr>`}
  </tbody></table></div>`;

  document.getElementById("createKeys").onclick=async()=>{
    const days=Number(document.getElementById("duration").value),qty=Math.max(1,Math.min(100,Number(document.getElementById("qty").value)||1)),note=document.getElementById("note").value.trim().slice(0,200);
    const made=[],batch=writeBatch(adminDb);
    try{
      for(let i=0;i<qty;i++){
        let code=makeKey(),hash=await sha256(code);
        made.push(code);
        batch.set(doc(adminDb,"keys",hash),{code,durationDays:days,note,createdAt:serverTimestamp(),revoked:false,revokedAt:null});
      }
      await batch.commit();await copyText(made.join("\n"),false);toast(`${qty} key(s) criada(s) e copiadas.`);renderAdmin();
    }catch(e){toast(errorText(e),true)}
  };
  document.getElementById("copyUnused").onclick=()=>{const a=s.keys.filter(k=>keyStatus(k)==="unused").map(k=>k.code);a.length?copyText(a.join("\n")):toast("Não há keys não usadas.",true)};
  document.getElementById("keySearch").onchange=e=>{keySearch=e.target.value;renderAdmin()};document.getElementById("keyFilter").onchange=e=>{keyFilter=e.target.value;renderAdmin()};
  document.querySelectorAll("[data-kcopy]").forEach(b=>b.onclick=()=>{const k=s.keys.find(x=>x.hash===b.dataset.kcopy);k&&copyText(k.code)});
  document.querySelectorAll("[data-krevoke]").forEach(b=>b.onclick=async()=>{
    const k=s.keys.find(x=>x.hash===b.dataset.krevoke);if(!k)return;
    const next=!k.revoked;
    try{
      if(!next&&keyStatus(k)==="expired")return toast("Key expirada não pode ser reativada.",true);
      await updateDoc(doc(adminDb,"keys",k.hash),{revoked:next,revokedAt:next?serverTimestamp():null});
      renderAdmin();
    }catch(e){toast(errorText(e),true)}
  });
  document.querySelectorAll("[data-kdelete]").forEach(b=>b.onclick=()=>confirmBox("Excluir key","Ela deixará de funcionar imediatamente.",async()=>{
    const k=s.keys.find(x=>x.hash===b.dataset.kdelete);if(!k)return;
    try{
      const batch=writeBatch(adminDb);
      batch.delete(doc(adminDb,"keys",k.hash));
      batch.delete(doc(adminDb,"claims",k.hash));
      await batch.commit();
      toast("Key excluída.");renderAdmin();
    }catch(e){toast(errorText(e),true)}
  }));
}

function adminLogs(c,s){
  const events=[];
  for(const k of s.keys){
    if(k.createdAt)events.push({at:k.createdAt,type:"Key criada",key:k.code,detail:`Prazo: ${k.durationDays} dias${k.note?` · ${k.note}`:""}`});
    if(k.activatedAt)events.push({at:k.activatedAt,type:"Key ativada",key:k.code,detail:"Primeiro acesso e vínculo ao navegador."});
    if(k.lastAccessAt)events.push({at:k.lastAccessAt,type:"Último acesso",key:k.code,detail:`Total de acessos: ${k.accessCount||0}`});
    if(k.revokedAt)events.push({at:k.revokedAt,type:"Key revogada",key:k.code,detail:"Revogada pelo administrador."});
    if(keyStatus(k)==="expired")events.push({at:new Date(ms(k.activatedAt)+Number(k.durationDays)*86400000),type:"Key expirada",key:k.code,detail:"Prazo encerrado."});
  }
  for(const x of s.stock){
    if(x.status==="delivered"&&x.deliveredAt)events.push({at:x.deliveredAt,type:"Entrega",key:x.deliveredToKeyCode||"Admin",detail:`Item ${x.id} marcado como entregue.`});
  }
  events.sort((a,b)=>ms(b.at)-ms(a.at));
  const q=logSearch.trim().toLowerCase(),f=events.filter(x=>!q||x.type.toLowerCase().includes(q)||(x.key||"").toLowerCase().includes(q)||x.detail.toLowerCase().includes(q));

  c.innerHTML=`<div class="section" style="margin-top:0"><div><h2>Logs das keys</h2><p>Gerados a partir dos registros protegidos de keys e entregas.</p></div><div class="toolbar"><input id="logSearch" placeholder="Buscar..." value="${esc(logSearch)}"></div></div>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Evento</th><th>Key</th><th>Detalhe</th></tr></thead><tbody>${f.map(x=>`<tr><td>${fmt(x.at)}</td><td><b>${esc(x.type)}</b></td><td class="mono">${esc(x.key||"—")}</td><td>${esc(x.detail)}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">Sem registros.</div></td></tr>`}</tbody></table></div>`;
  document.getElementById("logSearch").onchange=e=>{logSearch=e.target.value;renderAdmin()};
}

function adminSettings(c,s){
  c.innerHTML=`<div class="grid g2">
    <div class="card">
      <div class="section" style="margin:0 0 12px"><div><h2>Administrador atual</h2></div></div>
      <div class="msg mono small">${esc(adminAuth.currentUser?.email||"—")}<br>UID: ${esc(adminAuth.currentUser?.uid||"—")}</div>
    </div>

    <div class="card">
      <div class="section" style="margin:0 0 12px"><div><h2>Backup</h2><p>Exporta estoque e keys visíveis para o administrador.</p></div></div>
      <button class="btn" id="backup">Baixar JSON</button>
    </div>

    <div class="card">
      <div class="section" style="margin:0 0 12px"><div><h2>Segurança</h2></div></div>
      <div class="notice ok">A autenticação administrativa é feita pelo Firebase Authentication e as permissões são aplicadas pelas regras do Firestore.</div>
    </div>

    <div class="card">
      <div class="section" style="margin:0 0 12px"><div><h2>Acesso oculto</h2></div></div>
      <div class="notice">Na página pública, sem selecionar nenhum campo, digite <b>ksadmin</b> para abrir o login administrativo.</div>
    </div>
  </div>`;

  document.getElementById("backup").onclick=()=>{
    const data={
      exportedAt:new Date().toISOString(),
      projectId:firebaseConfig.projectId,
      keys:s.keys.map(k=>({...k,createdAt:fmt(k.createdAt),activatedAt:fmt(k.activatedAt),lastAccessAt:fmt(k.lastAccessAt)})),
      stock:s.stock.map(x=>({...x,createdAt:fmt(x.createdAt),deliveredAt:fmt(x.deliveredAt)}))
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`keystock-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
}

home();
</script>
</body>
</html>
