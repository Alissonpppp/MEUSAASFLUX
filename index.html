<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">

<title>StreamBox+</title>

<style>
:root{
  --bg:#080808;
  --panel:#151515;
  --panel2:#202020;
  --text:#fff;
  --muted:#aaa;
  --red:#e50914;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:70px;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* TOPO */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,8,8,.96);
  backdrop-filter:blur(12px);
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
}

.top{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:900;
  white-space:nowrap;
}

.logo span{
  color:var(--red);
}

.search{
  margin-left:auto;
  width:min(330px,40vw);
  background:#181818;
  border:1px solid #333;
  color:white;
  padding:10px 12px;
  border-radius:7px;
  outline:none;
}

.gear{
  border:0;
  background:#222;
  color:#fff;
  border-radius:8px;
  width:42px;
  height:42px;
}

/* DESTAQUE */

.hero{
  position:relative;
  min-height:430px;
  height:62vh;
  max-height:650px;
  display:flex;
  align-items:flex-end;
  background:
    radial-gradient(circle at 75% 25%,rgba(229,9,20,.30),transparent 25%),
    linear-gradient(120deg,#252525,#070707 70%);
}

.heroImage{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center top;
}

.heroImage:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(0deg,#080808 0%,rgba(8,8,8,.25) 45%,rgba(0,0,0,.1)),
    linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.1));
}

.heroContent{
  position:relative;
  z-index:2;
  padding:30px 4vw 70px;
  max-width:700px;
}

.hero h1{
  font-size:clamp(34px,6vw,70px);
  line-height:1;
  margin:0 0 14px;
}

.hero p{
  color:#ddd;
  line-height:1.45;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.primary,
.secondary{
  border:0;
  padding:12px 17px;
  border-radius:7px;
  font-weight:800;
}

.primary{
  background:white;
  color:black;
}

.secondary{
  background:#555a;
  color:white;
}

/* CONTEÚDO */

main{
  position:relative;
  z-index:3;
  margin-top:-40px;
  padding:0 4vw 50px;
}

#status{
  color:#aaa;
  font-size:13px;
  margin-bottom:18px;
}

.row{
  margin-bottom:28px;
}

.row h2{
  margin:0 0 10px;
  font-size:20px;
}

.cards{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 3px 14px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.cards::-webkit-scrollbar{
  display:none;
}

.card{
  border:0;
  padding:0;
  color:white;
  text-align:left;
  background:#181818;
  position:relative;
  flex:0 0 min(180px,16vw);
  aspect-ratio:2/3;
  border-radius:7px;
  overflow:hidden;
  scroll-snap-align:start;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.fallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  padding:14px;
  background:linear-gradient(145deg,#292929,#101010);
  font-weight:800;
}

.cardInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:40px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
}

.cardTitle{
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.progress{
  height:3px;
  background:#555;
  position:absolute;
  left:8px;
  right:8px;
  bottom:5px;
}

.progress span{
  display:block;
  height:100%;
  background:var(--red);
}

.listMark{
  position:absolute;
  right:7px;
  top:7px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#000b;
  border:1px solid #aaa;
  display:grid;
  place-items:center;
}

/* MENU MOBILE */

.mobileNav{
  position:fixed;
  z-index:60;
  bottom:0;
  left:0;
  right:0;
  display:none;
  background:#090909f5;
  border-top:1px solid #252525;
  padding-bottom:env(safe-area-inset-bottom);
}

.mobileNav button{
  flex:1;
  border:0;
  background:transparent;
  color:#999;
  padding:9px 2px;
  font-size:11px;
}

.mobileNav button.active{
  color:white;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  background:#000d;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px;
}

.modalBox{
  position:relative;
  background:#151515;
  width:min(600px,100%);
  margin:5vh auto;
  border-radius:12px;
  padding:25px;
}

.close{
  position:absolute;
  right:12px;
  top:12px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:white;
  font-size:22px;
}

.tabs{
  display:flex;
  gap:7px;
  margin:20px 0;
  overflow-x:auto;
}

.tabs button{
  border:0;
  color:white;
  background:#252525;
  border-radius:7px;
  padding:9px 12px;
  white-space:nowrap;
}

.tabs button.active{
  background:var(--red);
}

.form{
  display:grid;
  gap:13px;
}

.form label{
  display:grid;
  gap:6px;
  color:#ddd;
  font-size:13px;
}

.form input{
  background:#0c0c0c;
  color:white;
  border:1px solid #3b3b3b;
  padding:12px;
  border-radius:7px;
  font-size:16px;
}

.red{
  background:var(--red);
  color:white;
  border:0;
  padding:12px;
  border-radius:7px;
  font-weight:800;
}

/* DETALHES */

.detailImage{
  height:340px;
  background-size:cover;
  background-position:center;
  border-radius:9px;
  position:relative;
}

.detailImage:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(0deg,#151515,transparent 70%);
}

.detailContent{
  position:relative;
  margin-top:-80px;
  z-index:2;
}

.detailContent h2{
  font-size:32px;
}

.episodes{
  display:grid;
  gap:7px;
  margin-top:20px;
}

.episode{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:12px;
  background:#222;
  border-radius:7px;
}

.episode button{
  border:0;
  background:#444;
  color:white;
  border-radius:7px;
  padding:9px;
}

/* PLAYER */

.playerModal{
  background:#000;
  padding:0;
  overflow:hidden;
}

.player{
  width:100vw;
  height:100dvh;
  position:relative;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
}

.back{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  left:12px;
  z-index:5;
  width:44px;
  height:44px;
  border-radius:50%;
  border:0;
  background:#111c;
  color:white;
  font-size:21px;
}

/* CELULAR */

@media(max-width:650px){

  header{
    padding-left:10px;
    padding-right:10px;
  }

  .top{
    display:grid;
    grid-template-columns:auto 1fr auto;
  }

  .logo{
    font-size:19px;
  }

  .search{
    grid-row:2;
    grid-column:1 / -1;
    width:100%;
    margin-top:5px;
    font-size:16px;
  }

  .hero{
    height:58vh;
  }

  .heroContent{
    padding:20px 14px 55px;
  }

  .hero h1{
    font-size:35px;
  }

  .hero p{
    font-size:14px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  main{
    padding:0 11px 70px;
    margin-top:-25px;
  }

  .card{
    flex-basis:42vw;
  }

  .mobileNav{
    display:flex;
  }

  .modal{
    padding:0;
  }

  .modalBox{
    margin:0;
    width:100%;
    min-height:100dvh;
    border-radius:0;
    padding:65px 15px 30px;
  }

  .close{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    right:12px;
    z-index:120;
  }

  .detailImage{
    height:48vh;
  }

}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
STREAM<span>BOX+</span>
</div>

<input
id="search"
class="search"
placeholder="Buscar filmes, séries..."
>

<button class="gear" onclick="openSettings()">
⚙
</button>

</div>

</header>


<section class="hero">

<div id="heroImage" class="heroImage"></div>

<div class="heroContent">

<h1 id="heroTitle">
Seu catálogo
</h1>

<p id="heroDescription">
Conecte sua lista ou servidor.
</p>

<div class="actions">

<button
class="primary"
onclick="heroPlay()">
▶ Assistir
</button>

<button
class="secondary"
onclick="heroDetails()">
ⓘ Informações
</button>

</div>

</div>

</section>


<main>

<div id="status">
Nenhuma fonte conectada.
</div>

<div id="content"></div>

</main>


<nav class="mobileNav">

<button
data-view="home"
class="active">
⌂<br>Início
</button>

<button data-view="live">
●<br>Ao vivo
</button>

<button data-view="vod">
▣<br>Filmes
</button>

<button data-view="series">
▤<br>Séries
</button>

<button data-view="mylist">
＋<br>Minha Lista
</button>

</nav>


<!-- CONFIGURAÇÃO -->

<div
id="settings"
class="modal hidden">

<div class="modalBox">

<button
class="close"
onclick="closeModal('settings')">
×
</button>

<h2>Fonte</h2>

<div class="tabs">

<button
id="m3uTab"
class="active"
onclick="sourceTab('m3u')">
M3U
</button>

<button
id="xtreamTab"
onclick="sourceTab('xtream')">
Xtream Codes
</button>

</div>


<div id="m3uSettings">

<form
class="form"
onsubmit="loadM3U(event)">

<label>

Arquivo M3U

<input
id="m3uFile"
type="file"
accept=".m3u,.m3u8,text/plain">

</label>

<label>

URL M3U

<input
id="m3uUrl"
placeholder="https://servidor/lista.m3u">

</label>

<button class="red">
Carregar
</button>

</form>

</div>


<div
id="xtreamSettings"
class="hidden">

<form
class="form"
onsubmit="connectXtream(event)">

<label>

Servidor

<input
id="server"
placeholder="http://servidor:porta"
required>

</label>

<label>

Usuário

<input
id="username"
required>

</label>

<label>

Senha

<input
id="password"
type="password"
required>

</label>

<button class="red">
Entrar
</button>

</form>

</div>

<p style="
color:#888;
font-size:12px;
line-height:1.5;
margin-top:20px;
">

Os dados de progresso e Minha Lista são
salvos somente neste navegador.

</p>

</div>

</div>


<!-- DETALHES -->

<div
id="details"
class="modal hidden">

<div class="modalBox">

<button
class="close"
onclick="closeModal('details')">
×
</button>

<div
id="detailImage"
class="detailImage">
</div>

<div class="detailContent">

<h2 id="detailTitle"></h2>

<p
id="detailDescription"
style="color:#bbb">
</p>

<div class="actions">

<button
id="detailPlay"
class="primary">
▶ Assistir
</button>

<button
id="listButton"
class="secondary">
＋ Minha Lista
</button>

</div>

<div
id="episodeArea"
class="episodes">
</div>

</div>

</div>

</div>


<!-- PLAYER -->

<div
id="playerModal"
class="modal playerModal hidden">

<div class="player">

<button
class="back"
onclick="closePlayer()">
←
</button>

<video
id="video"
controls
playsinline
webkit-playsinline>
</video>

</div>

</div>


<script>

const $ = selector =>
document.querySelector(selector);

const $$ = selector =>
[...document.querySelectorAll(selector)];


const STORE = "streambox_iphone_v1";


let database = {
progress:{},
mylist:{}
};


try{

const saved =
localStorage.getItem(STORE);

if(saved)
database =
JSON.parse(saved);

}catch(e){}


function save(){

try{

localStorage.setItem(
STORE,
JSON.stringify(database)
);

}catch(e){}

}


const state = {

source:null,

items:[],

view:"home",

creds:null,

catalog:{
live:null,
vod:null,
series:null
},

hero:null,

detail:null,

seriesInfo:null,

playing:null

};


function openSettings(){

$("#settings")
.classList.remove("hidden");

}


function closeModal(id){

$("#"+id)
.classList.add("hidden");

}


function sourceTab(type){

$("#m3uTab")
.classList.toggle(
"active",
type==="m3u"
);

$("#xtreamTab")
.classList.toggle(
"active",
type==="xtream"
);

$("#m3uSettings")
.classList.toggle(
"hidden",
type!=="m3u"
);

$("#xtreamSettings")
.classList.toggle(
"hidden",
type!=="xtream"
);

}


function cleanServer(url){

url =
url.trim()
.replace(/\/+$/,"");

if(
!/^https?:\/\//i.test(url)
)

url =
"http://" + url;

return url;

}


function xtreamURL(action=""){

const c =
state.creds;

let url =

cleanServer(c.server) +

"/player_api.php" +

"?username=" +

encodeURIComponent(c.username) +

"&password=" +

encodeURIComponent(c.password);

if(action)

url +=
"&action=" + action;

return url;

}


async function json(url){

const response =
await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)

throw new Error(
"HTTP " +
response.status
);

return response.json();

}


/* M3U */

async function loadM3U(event){

event.preventDefault();

try{

let text = "";

const file =
$("#m3uFile").files[0];

const url =
$("#m3uUrl")
.value.trim();


if(file){

text =
await file.text();

}

else if(url){

$("#status")
.textContent =
"Carregando lista...";

const response =
await fetch(url);

if(!response.ok)

throw new Error(
"HTTP " +
response.status
);

text =
await response.text();

}

else{

alert(
"Selecione um arquivo ou URL."
);

return;

}


state.items =
parseM3U(text);

state.source =
"m3u";

closeModal(
"settings"
);

$("#status")
.textContent =

state.items.length +
" itens carregados.";

render();

}

catch(error){

alert(
"Erro: " +
error.message +
"\n\nO servidor pode estar bloqueando CORS."
);

}

}


function parseM3U(text){

const lines =
text.split(/\r?\n/);

const result = [];

let current = null;


for(
const raw of lines
){

const line =
raw.trim();


if(
line.startsWith(
"#EXTINF:"
)
){

const attrs = {};

for(
const match of
line.matchAll(
/([\w-]+)="([^"]*)"/g
)
)

attrs[
match[1]
] =
match[2];


const name =

line.includes(",")

?

line.substring(
line.lastIndexOf(",")+1
).trim()

:

"Sem título";


const group =

attrs[
"group-title"
]

||

"Outros";


const lower =

(
name +
" " +
group
).toLowerCase();


let kind =
"live";


if(
/filme|movie|vod|cinema/.test(
lower
)
)

kind =
"vod";


if(
/serie|série|series|temporada|season/.test(
lower
)
)

kind =
"series";


current = {

name,

category:group,

logo:
attrs["tvg-logo"]
|| "",

kind,

url:""

};

}

else if(
current &&
line &&
!line.startsWith("#")
){

current.url =
line;

result.push(
current
);

current =
null;

}

}


return result;

}


/* XTREAM */

async function connectXtream(event){

event.preventDefault();

state.creds = {

server:
$("#server")
.value.trim(),

username:
$("#username")
.value.trim(),

password:
$("#password")
.value

};


$("#status")
.textContent =
"Conectando...";


try{

const auth =
await json(
xtreamURL()
);


if(
String(
auth?.user_info?.auth
)
!== "1"
)

throw new Error(
"Login recusado."
);


state.source =
"xtream";

state.catalog = {
live:null,
vod:null,
series:null
};


closeModal(
"settings"
);


$("#status")
.textContent =
"Conectado.";


render();

}

catch(error){

alert(
"Erro ao conectar.\n\n" +
error.message +
"\n\nSe funciona em outro app, o servidor pode estar bloqueando o navegador."
);

}

}


async function loadXtream(kind){

if(
state.catalog[kind]
)

return state.catalog[kind];


const actions = {

live:[
"get_live_categories",
"get_live_streams"
],

vod:[
"get_vod_categories",
"get_vod_streams"
],

series:[
"get_series_categories",
"get_series"
]

};


const [
categoryAction,
itemAction
] =
actions[kind];


const [
categories,
items
] =
await Promise.all([

json(
xtreamURL(
categoryAction
)
),

json(
xtreamURL(
itemAction
)
)

]);


const names =
new Map();


for(
const category of categories
|| []
){

names.set(
String(
category.category_id
),
category.category_name
);

}


const normalized =

(items || [])
.map(item => ({

...item,

kind,

category:

names.get(
String(
item.category_id
)
)

||

"Outros"

}));


state.catalog[kind] =
normalized;


return normalized;

}


async function allItems(){

if(
state.source ===
"m3u"
)

return state.items;


if(
state.source ===
"xtream"
){

const [
live,
vod,
series
] =
await Promise.all([

loadXtream("live"),

loadXtream("vod"),

loadXtream("series")

]);


return [
...live,
...vod,
...series
];

}


return [];

}


/* IDENTIFICADOR */

function key(item){

if(
item.__episode
)

return item.__episode;


if(
item.kind ===
"live"
)

return "live:" +
item.stream_id;


if(
item.kind ===
"vod"
)

return "vod:" +
item.stream_id;


if(
item.kind ===
"series"
)

return "series:" +
item.series_id;


return "m3u:" +
btoa(
encodeURIComponent(
item.url || item.name
)
)
.slice(0,50);

}


/* PROGRESSO */

function progress(item){

return database.progress[
key(item)
];

}


function percentage(item){

const p =
progress(item);

if(
!p ||
!p.duration
)

return 0;


return Math.min(
100,
p.time /
p.duration *
100
);

}


/* MINHA LISTA */

function isListed(item){

return !!database.mylist[
key(item)
];

}


function toggleList(item){

const k =
key(item);


if(
database.mylist[k]
)

delete database.mylist[k];

else

database.mylist[k] =
cleanItem(item);


save();

render();

openDetails(item);

}


function cleanItem(item){

return {

name:
item.name,

title:
item.title,

kind:
item.kind,

category:
item.category,

logo:
item.logo,

stream_icon:
item.stream_icon,

cover:
item.cover,

stream_id:
item.stream_id,

series_id:
item.series_id,

container_extension:
item.container_extension,

url:
item.url

};

}


/* RENDER */

async function render(){

const content =
$("#content");

content.innerHTML = "";


if(
!state.source
){

content.innerHTML =
"<p style='color:#777'>Conecte uma fonte.</p>";

return;

}


try{

let items =
await allItems();


const query =

$("#search")
.value
.toLowerCase()
.trim();


if(query){

items =
items.filter(
item =>

String(
item.name ||
item.title ||
""
)
.toLowerCase()
.includes(query)
);

renderRow(
"Resultados",
items
);

return;

}


chooseHero(items);


if(
state.view ===
"mylist"
){

renderGrouped(
Object.values(
database.mylist
)
);

return;

}


if(
state.view !==
"home"
){

items =
items.filter(
item =>
item.kind ===
state.view
);

renderGrouped(
items
);

return;

}


/* CONTINUAR */

const watching =

Object.values(
database.progress
)

.filter(
p =>
p.item &&
p.time > 20 &&
p.duration &&
p.time /
p.duration <
.95
)

.sort(
(a,b)=>
b.updated -
a.updated
)

.map(
p => p.item
);


if(
watching.length
)

renderRow(
"Continuar assistindo",
watching
);


/* MINHA LISTA */

const mylist =

Object.values(
database.mylist
);


if(
mylist.length
)

renderRow(
"Minha Lista",
mylist
);


/* PRINCIPAIS */

const live =
items.filter(
x => x.kind === "live"
);

const movies =
items.filter(
x => x.kind === "vod"
);

const series =
items.filter(
x => x.kind === "series"
);


if(live.length)
renderRow(
"Ao vivo",
live.slice(0,30)
);

if(movies.length)
renderRow(
"Filmes",
movies.slice(0,30)
);

if(series.length)
renderRow(
"Séries",
series.slice(0,30)
);


/* CATEGORIAS */

const groups =
new Map();


for(
const item of items
){

const group =
item.category ||
"Outros";


if(
!groups.has(group)
)

groups.set(
group,
[]
);


if(
groups.get(group)
.length < 30
)

groups.get(group)
.push(item);

}


let count = 0;

for(
const [
name,
groupItems
] of groups
){

if(
count++ > 8
)

break;


renderRow(
name,
groupItems
);

}

}

catch(error){

$("#status")
.textContent =
"Erro: " +
error.message;

}

}


function renderGrouped(items){

const groups =
new Map();


for(
const item of items
){

const group =
item.category ||
"Outros";


if(
!groups.has(group)
)

groups.set(
group,
[]
);


groups
.get(group)
.push(item);

}


for(
const [
name,
items
] of groups
)

renderRow(
name,
items
);

}


function renderRow(
title,
items
){

if(
!items.length
)

return;


const section =
document.createElement(
"section"
);


section.className =
"row";


section.innerHTML =

"<h2>" +
escapeHTML(title) +
"</h2>" +

"<div class='cards'></div>";


const cards =
section.querySelector(
".cards"
);


for(
const item of
items.slice(0,100)
)

cards.appendChild(
card(item)
);


$("#content")
.appendChild(
section
);

}


function card(item){

const button =
document.createElement(
"button"
);


button.className =
"card";


const title =
item.name ||
item.title ||
"Sem título";


const image =

item.stream_icon ||

item.cover ||

item.logo ||

"";


const pct =
percentage(item);


button.innerHTML =

image

?

"<img src='" +
escapeHTML(image) +
"' alt=''>"

:

"<div class='fallback'>" +
escapeHTML(title) +
"</div>";


button.innerHTML +=

"<div class='cardInfo'>" +

"<div class='cardTitle'>" +
escapeHTML(title) +
"</div>" +

"</div>";


if(
pct > 0
){

button.innerHTML +=

"<div class='progress'>" +

"<span style='width:" +
pct +
"%'></span>" +

"</div>";

}


if(
isListed(item)
){

button.innerHTML +=

"<div class='listMark'>✓</div>";

}


button.onclick =
() =>
openDetails(item);


return button;

}


/* HERO */

function chooseHero(items){

state.hero =

Object.values(
database.progress
)
.filter(
p => p.item
)
.sort(
(a,b)=>
b.updated -
a.updated
)[0]?.item

||

items.find(
x =>
x.kind !==
"live"
)

||

items[0];


if(
!state.hero
)

return;


const item =
state.hero;


$("#heroTitle")
.textContent =

item.name ||
item.title ||
"Seu catálogo";


$("#heroDescription")
.textContent =

item.plot ||

item.category ||

"Continue assistindo de onde parou.";


const image =

item.cover ||

item.stream_icon ||

item.logo ||

"";


$("#heroImage")
.style.backgroundImage =

image

?

"url('" +
image.replace(/'/g,"%27") +
"')"

:

"";

}


function heroPlay(){

if(
state.hero
)

playSmart(
state.hero
);

}


function heroDetails(){

if(
state.hero
)

openDetails(
state.hero
);

}


/* DETALHES */

async function openDetails(item){

state.detail =
item;


$("#detailTitle")
.textContent =

item.name ||
item.title ||
"Sem título";


$("#detailDescription")
.textContent =

item.plot ||

item.category ||

"";


const image =

item.cover ||

item.stream_icon ||

item.logo ||

"";


$("#detailImage")
.style.backgroundImage =

image

?

"url('" +
image.replace(/'/g,"%27") +
"')"

:

"linear-gradient(135deg,#333,#111)";


$("#listButton")
.textContent =

isListed(item)

?

"✓ Na Minha Lista"

:

"＋ Minha Lista";


$("#listButton")
.onclick =
() =>
toggleList(item);


$("#detailPlay")
.onclick =
() =>
playSmart(item);


$("#episodeArea")
.innerHTML = "";


$("#details")
.classList.remove(
"hidden"
);


if(
item.kind ===
"series" &&
state.source ===
"xtream"
){

try{

const info =
await json(

xtreamURL(
"get_series_info"
)

+

"&series_id=" +

encodeURIComponent(
item.series_id
)

);


state.seriesInfo =
info;


renderEpisodes(
item,
info
);

}

catch(e){}

}

}


function renderEpisodes(
series,
info
){

const episodes =
info.episodes ||
{};


for(
const season of
Object.keys(episodes)
.sort(
(a,b)=>
Number(a)-Number(b)
)
){

const h =
document.createElement(
"h3"
);

h.textContent =
"Temporada " +
season;


$("#episodeArea")
.appendChild(h);


for(
const ep of
episodes[season]
){

const row =
document.createElement(
"div"
);


row.className =
"episode";


row.innerHTML =

"<div>" +

"<b>" +

escapeHTML(
ep.title ||
"Ep. " +
ep.episode_num
) +

"</b>" +

"<br>" +

"<small style='color:#999'>" +

"T" +
season +
" E" +
ep.episode_num +

"</small>" +

"</div>" +

"<button>▶</button>";


row.querySelector(
"button"
)
.onclick =
() =>
playEpisode(
series,
season,
ep
);


$("#episodeArea")
.appendChild(
row
);

}

}

}


/* PLAYER */

async function playSmart(item){

if(
item.kind ===
"series" &&
state.source ===
"xtream"
){

try{

const info =
state.seriesInfo

||

await json(

xtreamURL(
"get_series_info"
)

+

"&series_id=" +

item.series_id

);


const seasons =

Object.keys(
info.episodes ||
{}
)
.sort(
(a,b)=>
Number(a)-Number(b)
);


for(
const season of seasons
){

for(
const ep of
info.episodes[season]
){

const episode =
episodeItem(
item,
season,
ep
);


const p =
progress(
episode
);


if(
p &&
p.time > 20 &&
p.time /
p.duration <
.95
){

playEpisode(
item,
season,
ep
);

return;

}

}

}


if(
seasons.length
){

const first =
info.episodes[
seasons[0]
][0];


playEpisode(
item,
seasons[0],
first
);

return;

}

}

catch(e){}

}


playItem(item);

}


function episodeItem(
series,
season,
ep
){

return {

name:

(series.name ||
series.title)

+

" - " +

(
ep.title ||
"Ep. " +
ep.episode_num
),

kind:"vod",

stream_id:
ep.id,

container_extension:
ep.container_extension ||
"mp4",

cover:
series.cover ||
series.stream_icon,

__episode:

"episode:" +

series.series_id +

":" +

season +

":" +

ep.id

};

}


function playEpisode(
series,
season,
ep
){

const item =
episodeItem(
series,
season,
ep
);


const base =
cleanServer(
state.creds.server
);


const url =

base +

"/series/" +

encodeURIComponent(
state.creds.username
) +

"/" +

encodeURIComponent(
state.creds.password
) +

"/" +

ep.id +

"." +

(
ep.container_extension ||
"mp4"
);


startVideo(
item,
url
);

}


function playItem(item){

let url =
item.url;


if(
state.source ===
"xtream"
){

const base =
cleanServer(
state.creds.server
);


const user =
encodeURIComponent(
state.creds.username
);


const pass =
encodeURIComponent(
state.creds.password
);


if(
item.kind ===
"live"
)

url =

base +
"/live/" +
user +
"/" +
pass +
"/" +
item.stream_id +
".m3u8";


else

url =

base +
"/movie/" +
user +
"/" +
pass +
"/" +
item.stream_id +
"." +
(
item.container_extension ||
"mp4"
);

}


startVideo(
item,
url
);

}


function startVideo(
item,
url
){

state.playing =
item;


const video =
$("#video");


video.pause();

video.removeAttribute(
"src"
);


video.src =
url;


$("#playerModal")
.classList.remove(
"hidden"
);


const p =
progress(item);


video.onloadedmetadata =
() => {

if(
p &&
p.time > 20 &&
p.time <
video.duration - 5
)

video.currentTime =
p.time;


video.play()
.catch(()=>{});

};

}


$("#video")
.addEventListener(
"timeupdate",
() => {

const video =
$("#video");


if(
!state.playing ||
!video.duration ||
!isFinite(
video.duration
)
)

return;


if(
state.playing.kind ===
"live" &&
!state.playing.__episode
)

return;


database.progress[
key(
state.playing
)
] = {

time:
video.currentTime,

duration:
video.duration,

updated:
Date.now(),

item:
cleanItem(
state.playing
)

};


if(
state.playing.__episode
)

database.progress[
key(
state.playing
)
].item.__episode =
state.playing.__episode;


save();

}
);


function closePlayer(){

const video =
$("#video");


video.pause();

video.removeAttribute(
"src"
);

video.load();


$("#playerModal")
.classList.add(
"hidden"
);


state.playing =
null;


render();

}


/* NAVEGAÇÃO */

$$(
".mobileNav button"
)
.forEach(
button => {

button.onclick =
() => {

$$(
".mobileNav button"
)
.forEach(
x =>
x.classList.remove(
"active"
)
);


button.classList.add(
"active"
);


state.view =
button.dataset.view;


render();

};

}
);


$("#search")
.addEventListener(
"input",
render
);


/* ESCAPE */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/[&<>"']/g,
char => ({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#39;"

})[char]
);

}


render();

</script>

</body>
</html>
